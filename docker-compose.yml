# Default: Redis + MinIO only (Flask uses MySQL on the host, e.g. MySQL Workbench on :3306).
# To run MySQL in Docker instead: docker compose --profile docker-mysql up -d
# (Stop host mysqld first, or set MYSQL_PORT=3307 in .env to avoid port conflict.)

services:
  mysql:
    profiles: ["docker-mysql"]
    image: mysql:8.0
    container_name: aari-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-highschool}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aari-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aari-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional: run Flask + RQ worker in Docker (uncomment and add a Dockerfile with ffmpeg).
  # Requires: apt-get install ffmpeg in the image.
  #
  # app:
  #   build: .
  #   container_name: aari-app
  #   restart: unless-stopped
  #   ports:
  #     - "${FLASK_PORT:-5000}:5000"
  #   env_file: .env
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   command: flask --app app run --host 0.0.0.0 --port 5000
  #
  # worker:
  #   build: .
  #   container_name: aari-rq-worker
  #   restart: unless-stopped
  #   env_file: .env
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     minio:
  #       condition: service_healthy
  #   command: rq worker --url ${REDIS_URL} dc-transcode

volumes:
  mysql_data:
  redis_data:
  minio_data:
